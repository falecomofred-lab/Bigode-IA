<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Bigode IA — Venure</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3">
  <meta name="theme-color" content="#0A0C11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bigode">

  <!-- Design System Venure (em ordem) -->
  <!-- 1. Sistema base Venure (compartilhado com Pipi) — 179 linhas -->
  <link rel="stylesheet" href="/venure.css">

  <!-- 2. Variáveis de cor do Bigode (verde sage) -->
  <style>
    :root {
      --ac: #9DC08B;
      --ac-rgb: 157, 192, 139;
    }
  </style>

  <!-- 3. Extensão com componentes + layout — 450+ linhas -->
  <link rel="stylesheet" href="/venure-componentes.css">

  <!-- 4. Liquid Glass para componentes (3 camadas: blur + shadow + luz) -->
  <link rel="stylesheet" href="/bigode-liquid-glass.css">
</head>
<body>
  <div class="container">
    <!-- ╔════════════════════════════════════════════════════════════╗
         ║ SIDEBAR: Histórico de conversas com cérebro autônomo      ║
         ║ Component: bigode-sidebar                                  ║
         ╚════════════════════════════════════════════════════════════╝ -->
    <bigode-sidebar id="sidebar"></bigode-sidebar>

    <!-- ╔════════════════════════════════════════════════════════════╗
         ║ MAIN CONTENT: Chat + Header + Input                       ║
         ║ Components: header, bigode-chat, bigode-composer           ║
         ╚════════════════════════════════════════════════════════════╝ -->
    <div class="tronco">
      <!-- Header with Liquid Glass -->
      <header>
        <div class="marca">
          <div class="selo">
            <img src="/logo.svg" alt="Bigode IA" style="width:100%; height:100%; object-fit:cover; border-radius:inherit;">
          </div>
          <div>
            <b>Bigode IA</b>
            <i>Cérebro Autônomo</i>
          </div>
        </div>

        <!-- Theme Toggle com transição suave -->
        <div class="dir">
          <bigode-theme-toggle id="theme-toggle"></bigode-theme-toggle>
        </div>
      </header>

      <!-- Chat Area -->
      <bigode-chat id="chat"></bigode-chat>

      <!-- Input Composer with Glass Effect -->
      <div class="base">
        <bigode-composer id="composer"></bigode-composer>
        <div class="rodape">
          <a href="https://venure.com.br" target="_blank">venure.com.br</a>
          <span>·</span>
          <span>tecnologia própria</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ╔════════════════════════════════════════════════════════════╗
       ║ SCRIPTS: Carregamento de bibliotecas e componentes        ║
       ║ Ordem crítica: lib → componentes → app                     ║
       ╚════════════════════════════════════════════════════════════╝ -->

  <!-- Lib utilities (carregam primeiro) -->
  <script src="/lib/theme-manager.js"></script>
  <script src="/lib/validators.js"></script>

  <!-- Web Components -->
  <script src="/components/bigode-sidebar.js"></script>
  <script src="/components/bigode-toast.js"></script>
  <script src="/components/bigode-progress.js"></script>
  <script src="/components/bigode-skeleton.js"></script>
  <script src="/components/bigode-message.js"></script>
  <script src="/components/bigode-chat.js"></script>
  <script src="/components/bigode-composer.js"></script>
  <script src="/components/bigode-theme-toggle.js"></script>

  <!-- App (orquestrador da lógica) -->
  <script src="/app.js"></script>

  <!-- Script inline para inicialização básica -->
  <script>
    // Elementos
    const sidebar = document.querySelector('#sidebar');
    const chat = document.querySelector('#chat');
    const composer = document.querySelector('#composer');
    const themeToggle = document.querySelector('#theme-toggle');

    // ════════════════════════════════════════════════════════════
    // EVENTOS DO COMPOSITOR
    // ════════════════════════════════════════════════════════════
    document.addEventListener('message-sent', async (e) => {
      const { message, type } = e.detail;

      if (type === 'text' && message) {
        // Adicionar mensagem do usuário
        chat.addMessage('user', message);

        // Mostrar progresso
        const progress = document.createElement('bigode-progress');
        progress.setAttribute('indeterminate', '');
        progress.style.margin = '0 20px';
        chat.shadowRoot.querySelector('.messages-area').appendChild(progress);

        try {
          // Conectar ao cérebro agente (quando implementado)
          const response = await fetch('http://localhost:5000/processar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ texto: message, tipo: 'texto' })
          });

          if (!response.ok) throw new Error('Erro ao processar');

          const resultado = await response.json();
          progress.remove();

          // Simular resposta (será do cérebro)
          chat.addMessage('assistant', '✅ Processado com sucesso!');
          Toast.success('Operação concluída');
        } catch (erro) {
          progress.remove();
          chat.addMessage('assistant', `❌ Erro: ${erro.message}`);
          Toast.error('Falha na execução');
        }
      } else if (type === 'audio') {
        chat.addMessage('user', '🎤 Áudio enviado');
        Toast.success('Áudio processado');
      }

      composer.clear();
    });

    // ════════════════════════════════════════════════════════════
    // EVENTOS DA SIDEBAR
    // ════════════════════════════════════════════════════════════
    document.addEventListener('novo-chat', () => {
      chat.clearMessages();
      Toast.success('Nova conversa iniciada');
      composer.focus();

      // Adicionar conversa no sidebar
      const title = prompt('Nome da conversa?') || 'Sem título';
      sidebar.addConversa(`conv-${Date.now()}`, title, new Date());
    });

    document.addEventListener('selecionar-conversa', (e) => {
      const convId = e.detail.id;
      // Carregar conversa (integração com backend)
      chat.clearMessages();
      chat.addMessage('assistant', `Carregando conversa: ${convId}`);
      composer.focus();
    });

    document.addEventListener('abrir-config', () => {
      Toast.info('Configurações (em breve)');
    });

    // ════════════════════════════════════════════════════════════
    // TEMA
    // ════════════════════════════════════════════════════════════
    document.addEventListener('theme-toggled', (e) => {
      console.log('Tema alterado para:', e.detail.theme);
    });

    // ════════════════════════════════════════════════════════════
    // INICIALIZAÇÃO
    // ════════════════════════════════════════════════════════════
    window.addEventListener('load', () => {
      // Adicionar conversa de exemplo
      sidebar.addConversa('conv-welcome', 'Bem-vindo ao Bigode 3.0!', new Date());

      // Mensagem inicial
      setTimeout(() => {
        chat.addMessage('assistant', 'Olá! 👋 Bem-vindo ao Bigode IA 3.0\n\nSou um agente autônomo rodando localmente no seu hardware, com acesso a GitHub e Google Drive. Digite uma mensagem para começar!');
        Toast.info('Sistema pronto');
        composer.focus();
      }, 300);
    });

    // ════════════════════════════════════════════════════════════
    // TECLAS DE ATALHO
    // ════════════════════════════════════════════════════════════
    document.addEventListener('keydown', (e) => {
      // Cmd/Ctrl + K: Focus no composer
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        composer.focus();
      }

      // Escape: Limpar e focar
      if (e.key === 'Escape') {
        composer.clear();
        composer.focus();
      }
    });
  </script>
</body>
</html>
